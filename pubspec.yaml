name: flutter_ci
description: >-
  CLI tool for Flutter CI/CD: bumps pubspec versions, builds Android and iOS
  artifacts, stores them in versioned folders, tags releases and distributes
  builds.
version: 0.0.3
homepage: https://github.com/nisargratani/flutter_ci
repository: https://github.com/nisargratani/flutter_ci
issue_tracker: https://github.com/nisargratani/flutter_ci/issues
topics:
  - cli
  - flutter
  - ci
  - cd
  - automation

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  process_run: ^1.2.2+1
  yaml: ^3.1.2
  yaml_edit: ^2.2.1

dev_dependencies:
  lints: ">=5.0.0 <7.0.0"
  test: ^1.25.0

executables:
  flutter_ci:
